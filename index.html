  <body>
    <!-- ✅ Netlify form (정리된 단일 버전) -->
    <form
      name="project_consult"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="project_consult" />
      <p hidden>
        <label>Don't fill this out: <input name="bot-field" /></label>
      </p>

      <!-- 공통 -->
      <input name="project" />
      <input name="financeType" />
      <input name="segment" />
      <input name="pagePath" />

      <!-- 사용자 입력 -->
      <input name="companyName" />
      <input name="contactName" />
      <input name="phone" />
      <input name="email" />
      <input name="location" />
      <input name="modelOrSpec" />
      <input name="qty" />
      <textarea name="message"></textarea>
    </form>

    <!-- 기존 catalog form 유지 -->
    <form
      name="catalog"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="catalog" />
      <p hidden>
        <label>Don't fill this out: <input name="bot-field" /></label>
      </p>
      <input name="companyName" />
      <input name="contactName" />
      <input name="phone" />
      <input name="email" />
    </form>

    <div id="root"></div>

    <!-- ✅ PWA 스플래시 (React 로드 전 즉시 표시, 인라인 SVG로 네트워크 없이 렌더) -->
    <div id="pwa-splash" style="
      position: fixed; inset: 0; z-index: 9999;
      background: #EEF0FF;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
    ">
      <!-- 인라인 SVG 로고 (네트워크 없이 즉시 렌더) -->
      <svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" style="border-radius:28px; box-shadow:0 8px 32px rgba(10,25,47,0.15);">
        <rect width="120" height="120" fill="#0a192f" rx="28"/>
        <!-- 지게차 바퀴 -->
        <circle cx="38" cy="82" r="9" fill="none" stroke="#fff" stroke-width="3"/>
        <circle cx="38" cy="82" r="3" fill="#fff"/>
        <circle cx="72" cy="82" r="9" fill="none" stroke="#fff" stroke-width="3"/>
        <circle cx="72" cy="82" r="3" fill="#fff"/>
        <!-- 지게차 몸체 -->
        <rect x="28" y="58" width="52" height="20" rx="3" fill="#fff" opacity="0.9"/>
        <rect x="22" y="64" width="10" height="12" rx="2" fill="#fff"/>
        <!-- 포크 -->
        <rect x="76" y="54" width="22" height="4" rx="1" fill="#fff"/>
        <rect x="76" y="62" width="22" height="4" rx="1" fill="#fff"/>
        <!-- 마스트 -->
        <rect x="74" y="40" width="4" height="30" rx="1" fill="#fff" opacity="0.7"/>
        <!-- 번개 아이콘 -->
        <text x="60" y="48" text-anchor="middle" font-size="20" fill="#f59e0b">⚡</text>
        <!-- RNF 텍스트 -->
        <text x="60" y="105" text-anchor="middle" font-size="11" font-weight="800" fill="#fff" font-family="sans-serif" letter-spacing="2">RNF</text>
      </svg>
      <div style="text-align:center;">
        <div style="font-size:26px; font-weight:800; color:#0a192f; letter-spacing:2px; font-family:sans-serif;">
          RNF KOREA
        </div>
        <div style="font-size:11px; color:#64748b; letter-spacing:1.5px; margin-top:5px; font-family:sans-serif;">
          BATTERY &amp; PARTS · FINANCIAL SERVICE
        </div>
      </div>
    </div>
    <style>
      @keyframes rnfFadeIn {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    </style>
    <script>
      (function() {
        var isStandalone = window.matchMedia('(display-mode: standalone)').matches
          || window.navigator.standalone === true;
        if (!isStandalone) return;

        var el = document.getElementById('pwa-splash');

        // 즉시 페이드인 시작
        requestAnimationFrame(function() {
          requestAnimationFrame(function() {
            el.style.opacity = '1';
          });
        });

        // React 마운트 후 제거용 함수
        window.__hidePwaSplash = function() {
          el.style.opacity = '0';
          setTimeout(function() { el.style.display = 'none'; }, 500);
        };

        // 최대 5초 후 강제 제거
        setTimeout(function() {
          if (window.__hidePwaSplash) window.__hidePwaSplash();
        }, 5000);
      })();
    </script>

    <script type="module" src="/src/index.tsx"></script>
