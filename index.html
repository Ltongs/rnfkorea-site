  <body>
    <!-- ✅ Netlify form (정리된 단일 버전) -->
    <form
      name="project_consult"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="project_consult" />
      <p hidden>
        <label>Don't fill this out: <input name="bot-field" /></label>
      </p>

      <!-- 공통 -->
      <input name="project" />
      <input name="financeType" />
      <input name="segment" />
      <input name="pagePath" />

      <!-- 사용자 입력 -->
      <input name="companyName" />
      <input name="contactName" />
      <input name="phone" />
      <input name="email" />
      <input name="location" />
      <input name="modelOrSpec" />
      <input name="qty" />
      <textarea name="message"></textarea>
    </form>

    <!-- 기존 catalog form 유지 -->
    <form
      name="catalog"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="catalog" />
      <p hidden>
        <label>Don't fill this out: <input name="bot-field" /></label>
      </p>
      <input name="companyName" />
      <input name="contactName" />
      <input name="phone" />
      <input name="email" />
    </form>

    <div id="root"></div>

    <!-- ✅ PWA 스플래시 -->
    <div id="pwa-splash" style="
      position: fixed; inset: 0; z-index: 9999;
      background: #EEF0FF;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    ">
      <!-- 인라인 SVG 로고 (실제 로고 재현) -->
      <svg width="180" height="100" viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
        <!-- 지게차 바디 -->
        <rect x="60" y="110" width="100" height="44" rx="6" fill="#0a192f"/>
        <!-- 지게차 운전석 -->
        <rect x="120" y="80" width="40" height="40" rx="4" fill="#0a192f"/>
        <!-- 지게차 마스트 -->
        <rect x="160" y="60" width="8" height="80" rx="2" fill="#0a192f"/>
        <!-- 포크 -->
        <rect x="168" y="72" width="36" height="6" rx="2" fill="#0a192f"/>
        <rect x="168" y="88" width="36" height="6" rx="2" fill="#0a192f"/>
        <!-- 바퀴 좌 -->
        <circle cx="85" cy="160" r="18" fill="#0a192f"/>
        <circle cx="85" cy="160" r="9" fill="#EEF0FF"/>
        <circle cx="85" cy="160" r="3" fill="#0a192f"/>
        <!-- 바퀴 우 -->
        <circle cx="145" cy="160" r="18" fill="#0a192f"/>
        <circle cx="145" cy="160" r="9" fill="#EEF0FF"/>
        <circle cx="145" cy="160" r="3" fill="#0a192f"/>
        <!-- 배터리 번개 표시 -->
        <polygon points="108,88 100,108 108,108 100,128 116,104 108,104" fill="#1a56db"/>

        <!-- RNF KOREA 텍스트 -->
        <text x="210" y="120" font-family="Arial Black, sans-serif" font-weight="900" font-size="48" fill="#0a192f" letter-spacing="1">RNF</text>
        <text x="210" y="155" font-family="Arial Black, sans-serif" font-weight="900" font-size="36" fill="#0a192f" letter-spacing="2">KOREA</text>
        <!-- 서브타이틀 -->
        <text x="210" y="175" font-family="Arial, sans-serif" font-size="11" fill="#64748b" letter-spacing="1">BATTERY &amp; PARTS · FINANCIAL SERVICE</text>
      </svg>
    </div>
    <script>
      (function() {
        var isStandalone = window.matchMedia('(display-mode: standalone)').matches
          || window.navigator.standalone === true;
        if (!isStandalone) return;

        var el = document.getElementById('pwa-splash');

        // 즉시 페이드인
        requestAnimationFrame(function() {
          requestAnimationFrame(function() {
            el.style.opacity = '1';
          });
        });

        window.__hidePwaSplash = function() {
          el.style.opacity = '0';
          setTimeout(function() { el.style.display = 'none'; }, 400);
        };

        // 최대 5초 강제 제거
        setTimeout(function() {
          if (window.__hidePwaSplash) window.__hidePwaSplash();
        }, 5000);
      })();
    </script>

    <script type="module" src="/src/index.tsx"></script>
