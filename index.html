<!DOCTYPE html>
<html lang="ko" class="scroll-smooth">
  <head>

      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      gtag('config', 'G-4S1X3GVXZ2');

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RNF KOREA - 산업용 에너지 & 모빌리티 솔루션</title>

    <link rel="icon" href="/favicon.ico" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#0A192F" />

    <!-- ✅ Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- ✅ Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body>
    <!-- ✅ Netlify form (정리된 단일 버전) -->
    <form
      name="project_consult"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="project_consult" />
      <p hidden>
        <label>Don’t fill this out: <input name="bot-field" /></label>
      </p>

      <!-- 공통 -->
      <input name="project" />
      <input name="financeType" />
      <input name="segment" />
      <input name="pagePath" />

      <!-- 사용자 입력 -->
      <input name="companyName" />
      <input name="contactName" />
      <input name="phone" />
      <input name="email" />
      <input name="location" />
      <input name="modelOrSpec" />
      <input name="qty" />
      <textarea name="message"></textarea>
    </form>

    <!-- 기존 catalog form 유지 -->
    <form
      name="catalog"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="catalog" />
      <p hidden>
        <label>Don’t fill this out: <input name="bot-field" /></label>
      </p>
      <input name="companyName" />
      <input name="contactName" />
      <input name="phone" />
      <input name="email" />
    </form>

    <div id="root"></div>

    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
