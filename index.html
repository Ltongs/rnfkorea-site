  <body>
    <!-- ✅ Netlify form (정리된 단일 버전) -->
    <form
      name="project_consult"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="project_consult" />
      <p hidden>
        <label>Don't fill this out: <input name="bot-field" /></label>
      </p>

      <!-- 공통 -->
      <input name="project" />
      <input name="financeType" />
      <input name="segment" />
      <input name="pagePath" />

      <!-- 사용자 입력 -->
      <input name="companyName" />
      <input name="contactName" />
      <input name="phone" />
      <input name="email" />
      <input name="location" />
      <input name="modelOrSpec" />
      <input name="qty" />
      <textarea name="message"></textarea>
    </form>

    <!-- 기존 catalog form 유지 -->
    <form
      name="catalog"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="catalog" />
      <p hidden>
        <label>Don't fill this out: <input name="bot-field" /></label>
      </p>
      <input name="companyName" />
      <input name="contactName" />
      <input name="phone" />
      <input name="email" />
    </form>

    <div id="root"></div>

    <!-- ✅ PWA 스플래시 (React 로드 전 즉시 표시) -->
    <div id="pwa-splash" style="
      display: none;
      position: fixed; inset: 0; z-index: 9999;
      background: #EEF0FF;
      flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      transition: opacity 0.5s ease;
      opacity: 1;
    ">
      <img src="/icons/icon-180.png" alt="RNF KOREA" style="
        width: 120px; height: 120px;
        border-radius: 28px;
        box-shadow: 0 8px 32px rgba(10,25,47,0.15);
        animation: rnfFadeIn 0.7s ease-out forwards;
      " />
      <div style="
        text-align: center;
        animation: rnfFadeIn 0.7s ease-out 0.25s forwards;
        opacity: 0;
      ">
        <div style="font-size:28px; font-weight:800; color:#0a192f; letter-spacing:2px; font-family:sans-serif;">
          RNF KOREA
        </div>
        <div style="font-size:11px; color:#64748b; letter-spacing:1.5px; margin-top:4px; font-family:sans-serif;">
          BATTERY &amp; PARTS · FINANCIAL SERVICE
        </div>
      </div>
    </div>
    <style>
      @keyframes rnfFadeIn {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    </style>
    <script>
      // PWA standalone 모드에서만 스플래시 표시
      (function() {
        var isStandalone = window.matchMedia('(display-mode: standalone)').matches
          || window.navigator.standalone === true;
        if (!isStandalone) return;

        var el = document.getElementById('pwa-splash');
        el.style.display = 'flex';

        // React가 준비되면 제거 신호 보냄
        window.__hidePwaSplash = function() {
          el.style.opacity = '0';
          setTimeout(function() { el.style.display = 'none'; }, 500);
        };

        // 최대 4초 후 강제 제거 (React 로드 실패 대비)
        setTimeout(function() {
          if (window.__hidePwaSplash) window.__hidePwaSplash();
        }, 4000);
      })();
    </script>

    <script type="module" src="/src/index.tsx"></script>
  </body>
